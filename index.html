<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="368LqsvmJQ0YlUTXYfCJECUdsyx9pH_igRsfgkbNJ2I" />
    <!--
      Site icons. Paths are root-relative: files in public/ are served from the web root,
      so "/favicon.ico" is correct and the previous "/public/..." href resolved to the SPA
      fallback rather than an image.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PANCHVASTRA — Gen Z streetwear. Regular tees, oversized fits, shorts. Ships across India."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Fonts are loaded WITHOUT blocking the first paint.

      As a plain stylesheet this was a render-blocking request to a third-party origin:
      nothing on the page could paint until Google had answered, which on a mobile
      connection is commonly 200–500ms of a blank screen.

      `media="print"` makes the browser fetch it at low priority and not block on it;
      the onload handler flips it to `all` the moment it arrives. Combined with
      `display=swap` (already in the URL), text paints immediately in the fallback face
      and swaps when the real one lands.

      The <noscript> copy keeps the fonts working with JavaScript disabled, where the
      onload trick cannot run.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'; this.onload=null;"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>PANCHVASTRA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
