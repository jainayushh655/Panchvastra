<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <pattern id="stripes" width="46" height="46" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="46" height="46" fill="transparent"/>
      <rect width="10" height="46" fill="rgba(255,255,255,0.045)"/>
    </pattern>
  </defs>
  <rect width="900" height="1100" fill="url(#g)"/>
  <rect width="900" height="1100" fill="url(#stripes)"/>
  <rect width="900" height="1100" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
</svg>
