<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 540" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#191919"/>
      <stop offset="100%" stop-color="#040404"/>
    </linearGradient>
    <pattern id="stripes" width="40" height="40" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="transparent"/>
      <rect width="8" height="40" fill="rgba(255,255,255,0.045)"/>
    </pattern>
  </defs>
  <rect width="700" height="540" fill="url(#g)"/>
  <rect width="700" height="540" fill="url(#stripes)"/>
  <rect width="700" height="540" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
</svg>
